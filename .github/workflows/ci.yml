name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.15.0"
  FOUNDRY_VERSION: "1.8.1"

jobs:
  app:
    name: App quality, tests, and drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            contracts/out
            contracts/cache
          key: foundry-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('contracts/foundry.toml', 'contracts/toolchain.lock.json', 'contracts/src/**/*.sol', 'contracts/script/**/*.sol', 'contracts/test/**/*.sol') }}
          restore-keys: foundry-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-

      - run: npm ci

      - name: Record toolchain versions
        run: |
          node --version
          npm --version
          forge --version

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run convex:typecheck
      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage
          retention-days: 14

      - run: npm run contracts:check-catalog
      - run: npm run contracts:check-manifests
      - run: npm run contracts:check-bindings
      - run: npm run build

  e2e:
    name: Browser and accessibility checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Resolve the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >>"$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  contracts:
    name: Solidity reference lane
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            contracts/out
            contracts/cache
          key: foundry-ci-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('contracts/foundry.toml', 'contracts/toolchain.lock.json', 'contracts/src/**/*.sol', 'contracts/script/**/*.sol', 'contracts/test/**/*.sol') }}
          restore-keys: foundry-ci-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-

      - name: Reject Foundry version drift
        run: forge --version | grep -F "${{ env.FOUNDRY_VERSION }}"

      - run: forge fmt --root contracts --check
      - name: Build and measure the deployable vault
        run: forge build --root contracts contracts/src/SowmorrowVault.sol --sizes

      - name: Run the reference suite with the CI fuzz and invariant budget
        env:
          FOUNDRY_PROFILE: ci
        run: forge test --root contracts -vvv

      - name: Measure vault coverage
        run: forge coverage --root contracts --match-contract SowmorrowVaultTest --report lcov --report-file coverage.lcov

      - name: Upload Solidity coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-coverage
          path: contracts/coverage.lcov
          retention-days: 14

  security:
    name: Slither static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: contracts/security/uv.lock

      - run: npm ci

      - run: npm run contracts:slither

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: contracts/security/reports/slither.json
          retention-days: 30
